org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# R8 optimized resource shrinking (AGP 9.x). The default shrinker decides a
# resource is reachable as soon as any R-class field referencing it survives,
# which keeps a large tail of resources that only unused code pointed at.
# The optimized shrinker traces resources through R8's own optimized graph
# instead, so resources referenced solely by code R8 removed are removed too.
#
# It only changes which *unused* resources get dropped; anything reachable from
# surviving code, from the manifest, or by name is still kept. Resources looked
# up dynamically (Resources.getIdentifier) would need @keep/keep.xml, which this
# app does not use — nothing here resolves a resource from a runtime string.
android.r8.optimizedResourceShrinking=true
