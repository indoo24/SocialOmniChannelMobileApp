      description: |-
        The signals worth alerting on, in one response. Requires the `channel.manage` capability, which is checked inside the view rather than by a permission class.

        Always 200, including when it reports problems: a monitor needs to tell "the system is degraded" apart from "the metrics endpoint is broken", and a non-200 collapses the two.

