    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        direction:
          allOf:
          - $ref: '#/components/schemas/MessageDirectionEnum'
          readOnly: true
        sender_type:
          allOf:
          - $ref: '#/components/schemas/SenderTypeEnum'
          readOnly: true
        sender_name:
          type: string
          readOnly: true
        sender_initials:
          type: string
          readOnly: true
        message_type:
          allOf:
          - $ref: '#/components/schemas/MessageTypeEnum'
          readOnly: true
        text:
          type: string
          readOnly: true
        attachments:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        delivery_status:
          allOf:
          - $ref: '#/components/schemas/MessageDeliveryStatusEnum'
          readOnly: true
        delivery_error:
          type: string
          readOnly: true
        delivery_error_code:
          type: string
          description: |-
            The stable failure code, read from the recorded send error.

            Derived for the same reason ``sent_from_platform`` is: the provider's
            own diagnostics live in ``provider_metadata`` and never reach a browser.
          readOnly: true
        content_notice:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        client_message_id:
          type: string
          readOnly: true
        sent_at:
          type: string
          format: date-time
          readOnly: true
        delivered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reply_to:
          allOf:
          - $ref: '#/components/schemas/QuotedMessage'
          nullable: true
          readOnly: true
        sent_from_platform:
          type: boolean
          description: |-
            Whether this outbound message was typed somewhere other than here.

            The business replying from the Instagram or Page inbox comes back as a
            webhook echo, and it lands in the thread as an ordinary outbound bubble
            with a delivery tick — because it genuinely was sent. What was missing
            was *who* sent it.

            That gap had a cost. A completely blocked Instagram channel showed
            seventeen ticked outbound messages beside four red failures, and read as
            partly healthy; every one of the seventeen was an echo. This is the one
            bit that tells them apart.

            Derived, so `provider_metadata` itself never reaches a client — it is a
            sanitised provider payload, not a field anyone should read from a
            browser.
          readOnly: true
      required:
      - attachments
      - client_message_id
      - content_notice
      - delivered_at
      - delivery_error
      - delivery_error_code
      - delivery_status
      - direction
      - id
      - message_type
      - public_id
      - read_at
      - reply_to
      - sender_initials
      - sender_name
      - sender_type
      - sent_at
      - sent_from_platform
      - text
