      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: As on the list.
      - in: query
        name: lifecycle_stage
        schema:
          type: string
        description: As on the list.
      - in: query
        name: preferred_language
        schema:
          type: string
        description: As on the list.
      - in: query
        name: search
        schema:
          type: string
        description: As on the list.
      tags:
      - customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: The CSV file.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A filter does not fit.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Too many exports in the last minute.
  /api/dashboard/:
    get:
      operationId: dashboard_summary
      description: |-
        Computed live from aggregate queries. Every figure respects the caller's visibility scope, so an agent sees their own queue and a supervisor the whole organization.

        The `team` block is **omitted (null) rather than filtered** for callers without `analytics.view`, so the response never implies a number the caller is not entitled to.

        **Every number answers the requested period.** Nothing here is an all-time snapshot.

        Two different timestamps decide membership, because two different kinds of question are being asked. *Events* — `resolved`, `agent_confirmed_purchases` — are counted by when the event happened, so `resolved` means resolved during the period. *States* — open, unassigned, waiting, and every lead figure — have no history table behind them, so they are reported over a **cohort**: the conversations that began during the period, described as they stand now. `open` therefore means "started in this period and still open", which is answerable, rather than "was open at some point during it", which the database cannot reconstruct.

        The one exception is `team.online_agents`, which is live presence: there is no history of who was online, so it is always now.
      summary: Dashboard summary
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Start of a custom period, `YYYY-MM-DD`, a local calendar date.
      - in: query
        name: preset
        schema:
          type: string
        description: 'Calendar period, resolved in the organization''s timezone: `today`,
          `last_7_days`, `last_30_days`, `this_month`, `last_month`. Defaults to `today`.
          Mutually exclusive with `from`/`to`.'
      - in: query
        name: to
        schema:
          type: string
        description: End of a custom period, `YYYY-MM-DD`, inclusive and local. At
          most 366 days from `from`.
      tags:
      - dashboard
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
  /api/dashboard/channels/:
    get:
      operationId: dashboard_channels
      description: |-
        Requires `analytics.view`. Returned as a plain array ordered by total volume — **not paginated**.

        Muted channels are included: this reports what arrived, not what is queued, and hiding a muted channel would make it look like it stopped receiving.
      summary: Conversation volume per channel
      tags:
      - dashboard
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelBreakdownRow'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
  /api/dashboard/performance/:
    get:
      operationId: dashboard_performance
      description: |-
        Not gated on `analytics.view`: every employee is entitled to their own numbers. What narrows is the *set* of employees returned — an agent gets only themselves, a team leader their teams, and ADMIN/SUPERVISOR/QA the organization.

        Asking for a colleague's id you may not report on returns an empty `results` array rather than 403.
      summary: Per-employee performance
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: Trailing window in days. Clamped to 1-90; defaults to 14.
      - in: query
        name: employee
        schema:
          type: integer
        description: Restrict to one employee. Still subject to the visibility rule
          above.
      - in: query
        name: from
        schema:
          type: string
        description: Custom period start, `YYYY-MM-DD`, local.
      - in: query
        name: preset
        schema:
          type: string
        description: Calendar period in the organization's timezone (`today`, `last_7_days`,
          `last_30_days`, `this_month`, `last_month`). Takes precedence over `days`
          when supplied.
      - in: query
        name: to
        schema:
          type: string
        description: Custom period end, `YYYY-MM-DD`, local and inclusive.
      tags:
      - dashboard
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePerformanceResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
  /api/devices/heartbeat/:
    post:
      operationId: device_heartbeat
      description: |-
        Cheaper than re-registering: one indexed update, no token required. Also refreshes the employee's `last_seen_at`, since an app in the foreground is presence in the ordinary sense.

        Answers **404** when the identifier is not a live registration for this employee, so a client that believes it is registered discovers otherwise instead of silently never being notified. Re-register on 404.
      summary: Report that a device is still reachable
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceHeartbeatRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceHeartbeatRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceHeartbeatRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceHeartbeatResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: This device is not registered to the caller. Code is `not_registered`.
  /api/devices/register/:
    post:
      operationId: device_register
      description: |-
        Idempotent on `device_identifier`. The app calls this on every launch and on every push-token rotation, and both converge on one row.

        The owning employee always comes from the session, never the body. Re-registering an existing identifier under a different employee moves the device to them and stops the previous owner receiving its notifications.
      summary: Register a device for push notifications
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegisterResponse'
          description: An existing registration was refreshed. `created` is false.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegisterResponse'
          description: A new device was registered. `created` is true.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`device_identifier` missing, `platform` not one of ANDROID/IOS/WEB,
            or `push_token` longer than 4096 characters.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
  /api/devices/unregister/:
    post:
      operationId: device_unregister
      description: |-
        Called on sign-out. The row is kept and the token cleared rather than deleted, which preserves the audit trail.

        Always 204, **including when the device was never registered** — sign-out must not fail because client and server disagree about a device that is being discarded either way.
      summary: Stop sending notifications to a device
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUnregisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceUnregisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceUnregisterRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Unregistered, or never registered. No response body.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
