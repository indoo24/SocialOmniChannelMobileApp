      - updated_at
    KindEnum:
      enum:
      - FALLBACK_ASSIGNMENT
      - EMPLOYEE_DEACTIVATED_REASSIGNMENT
      - NO_USABLE_EMPLOYEE
      type: string
      description: |-
        * `FALLBACK_ASSIGNMENT` - Assigned by fallback routing
        * `EMPLOYEE_DEACTIVATED_REASSIGNMENT` - Work reassigned after an employee was deactivated
        * `NO_USABLE_EMPLOYEE` - No usable service employee
    LanguageEnum:
      enum:
      - ar
      - en
      type: string
      description: |-
        * `ar` - Arabic
        * `en` - English
    LeadScoreRequest:
      type: object
      description: |-
        Body for POST /conversations/{id}/lead-score/.

        ``score`` is nullable rather than optional, and the difference matters: an
        explicit ``null`` means "go back to the engine", while omitting the key
        entirely is a malformed request. Making reset an absent field would turn
        every client bug that drops the body into a silent revert of somebody's
        deliberate override.
      properties:
        score:
          type: integer
          maximum: 100
          minimum: 0
          nullable: true
      required:
      - score
    Login:
      type: object
