      description: |-
        * `SENT` - Accepted by the platform
        * `FAILED` - Rejected or unreachable
        * `NOT_CONFIGURED` - Integration not configured
        * `SKIPPED` - No event maps to this transition
        * `UNMATCHABLE` - No identifier Meta can match
