    FollowUp:
      type: object
      description: |-
        Body for POST /api/conversations/{id}/follow-up/.

        `follow_up_date` is deliberately three-valued:

        * absent  — leave whatever date is already there
        * ``null``— clear the date but keep the conversation flagged
        * a date  — set it

        Without that distinction, re-marking an already-dated conversation would
        silently wipe its date, and there would be no way to express "keep the flag,
        drop the day".

        Neither `follow_up_marked_at` nor `follow_up_marked_by` appears here. They
        are set by the server from the session, so a client cannot claim somebody
        else flagged a conversation, or backdate when.
      properties:
        is_follow_up:
          type: boolean
