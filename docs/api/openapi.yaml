      - low
      - medium
      - high
      type: string
      description: |-
        * `none` - None
        * `low` - Low
        * `medium` - Medium
        * `high` - High
    InternalNote:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
