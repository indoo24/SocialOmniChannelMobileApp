        note:
          type: string
          readOnly: true
        employee_name:
          type: string
          readOnly: true
          default: ''
        decided_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - decided_at
      - decision
      - employee_name
      - evidence
      - id
      - note
      - previous_status
    PurchaseConfirmationDecisionEnum:
      enum:
      - CONFIRMED
      - REJECTED
      type: string
      description: |-
        * `CONFIRMED` - Confirmed
        * `REJECTED` - Not confirmed
    PurchaseStatusEnum:
      enum:
      - NONE
      - INTENT_DETECTED
      - CUSTOMER_SAYS_ORDERED
      - CUSTOMER_SAYS_PAID
      - AGENT_CONFIRMED
      - CANCELLED
      - REFUND_MENTIONED
      type: string
      description: |-
        * `NONE` - No purchase signal
        * `INTENT_DETECTED` - Purchase intent detected
        * `CUSTOMER_SAYS_ORDERED` - Customer says they ordered
        * `CUSTOMER_SAYS_PAID` - Customer says they paid
        * `AGENT_CONFIRMED` - Confirmed by an employee
        * `CANCELLED` - Cancelled
        * `REFUND_MENTIONED` - Refund mentioned
    QueueMetrics:
      type: object
      description: |-
        Deliberately all-optional: this object has three genuinely different shapes.

        ``{enabled: false}`` when Celery is off, ``{enabled: true, reachable: false,
        error: ...}`` when the broker cannot be read, and the full set of depths
        when it can. Flattening them into one required shape would document fields
        that are frequently absent.
      properties:
        enabled:
          type: boolean
        reachable:
          type: boolean
        error:
          type: string
        ingest:
          type: integer
        analysis:
          type: integer
        backlogged:
          type: boolean
      required:
      - enabled
    QuotedMessage:
      type: object
      description: |-
        The message a reply quotes, flattened to exactly one level.

        Never a nested ``MessageSerializer``. A reply to a reply would then carry a
        reply, and a long enough chain would serialize a whole thread into one
        bubble — so this is a deliberate, terminal shape rather than a recursive
        one.

        Rendered from the *snapshot* rather than from the live row, so the quote
        keeps saying what it said even after the original is soft-deleted or edited.
        ``id`` and ``available`` describe what can still be *done* with it.
      properties:
        id:
          type: integer
          nullable: true
          description: Null when the quoted message is not one of ours — an inbound
            reply naming a platform message older than any we stored.
        text:
          type: string
        truncated:
          type: boolean
          description: The original was longer than the quote.
        message_type:
          type: string
        direction:
          type: string
        sender_name:
          type: string
        sent_at:
          type: string
        is_deleted:
          type: boolean
        available:
          type: boolean
          description: Whether the original can still be jumped to. False means render
            the quote but do not make it interactive.
      required:
      - available
      - direction
      - id
      - is_deleted
      - message_type
      - sender_name
      - sent_at
      - text
      - truncated
    RealtimeHealth:
      type: object
      description: Snapshot of `apps.realtime.health.counters`, per process.
      properties:
        published:
          type: integer
        failed:
          type: integer
        last_failure_at:
          type: string
          format: date-time
          nullable: true
        last_failure_detail:
          type: string
        degraded:
          type: boolean
      required:
      - degraded
      - failed
      - last_failure_at
      - last_failure_detail
      - published
    Reply:
      type: object
      description: |-
        A reply, which may be text, files, or both.

        ``text`` stops being required the moment there are attachments: a
        photograph is a complete message, and demanding a caption for one would be
        a worse composer than every messaging app an agent already uses.
      properties:
        text:
          type: string
          default: ''
          maxLength: 8000
        message_type:
          allOf:
          - $ref: '#/components/schemas/MessageTypeEnum'
          default: TEXT
        reply_to_id:
          type: integer
          nullable: true
        attachment_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
        client_message_id:
          type: string
          default: ''
          maxLength: 64
    ReportConversionResponse:
      type: object
      description: |-
        Outcome of pushing a conversation's stage to the Meta Conversions API.

        Three outcomes are kept distinct because they need three different
        reactions from the caller, and collapsing them into ok/not-ok would leave an
        agent pressing a button that appears to fail while working correctly.
      properties:
        status:
          type: string
          description: '`already_reported` when this stage was reported before and
            nothing was sent, otherwise the lower-cased ConversionEvent status — `sent`,
            `failed`, `skipped`, `unmatchable`.'
        detail:
          type: string
          description: Meta's own words when it refused, or a confirmation when it
            accepted.
        event_name:
          type: string
          description: Empty when nothing was sent.
        stage:
          type: string
        intelligence:
          $ref: '#/components/schemas/ConversationIntelligence'
      required:
      - detail
      - event_name
      - intelligence
      - stage
      - status
    RoleEnum:
      enum:
      - ADMIN
      - SUPERVISOR
      - TEAM_LEADER
      - AGENT
      - QA
      type: string
      description: |-
        * `ADMIN` - Administrator
        * `SUPERVISOR` - Supervisor
        * `TEAM_LEADER` - Team leader
        * `AGENT` - Agent
        * `QA` - Quality assurance
    RoutableProviderEnum:
      enum:
      - TIKTOK
      - INSTAGRAM
      - FACEBOOK
      - WHATSAPP
      type: string
      description: |-
        * `TIKTOK` - TikTok
        * `INSTAGRAM` - Instagram
        * `FACEBOOK` - Facebook Messenger
        * `WHATSAPP` - WhatsApp Business
    RoutingChannelScopeEnum:
      enum:
      - ALL
      - SELECTED
      type: string
      description: |-
        * `ALL` - All channels
        * `SELECTED` - Selected channels only
    RoutingPolicy:
      type: object
      description: Read shape. Carries the derived fields the settings screen displays.
      properties:
        is_enabled:
          type: boolean
        max_open_chats_per_agent:
          type: integer
          maximum: 200
          minimum: 1
        first_response_sla_seconds:
          type: integer
          maximum: 2147483647
          minimum: 30
        sticky_conversation_ownership:
          type: boolean
        escalation_max_hops:
          type: integer
          maximum: 20
          minimum: 0
        strict_responsibility:
          type: boolean
        timezone:
          type: string
          readOnly: true
        heartbeat_max_seconds:
          type: integer
          readOnly: true
      required:
      - heartbeat_max_seconds
      - timezone
    RoutingProvidersEnum:
      enum:
      - TIKTOK
      - INSTAGRAM
      - FACEBOOK
      - WHATSAPP
      type: string
      description: |-
        * `TIKTOK` - TIKTOK
        * `INSTAGRAM` - INSTAGRAM
        * `FACEBOOK` - FACEBOOK
        * `WHATSAPP` - WHATSAPP
    RoutingResponsibility:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        team:
          allOf:
          - $ref: '#/components/schemas/_TeamRef'
          readOnly: true
          nullable: true
        employee:
          allOf:
          - $ref: '#/components/schemas/_EmployeeRef'
          readOnly: true
          nullable: true
        provider:
          type: string
          readOnly: true
        channel_connection:
          allOf:
          - $ref: '#/components/schemas/_ConnectionRef'
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - channel_connection
      - created_at
      - employee
      - id
      - is_active
      - provider
      - team
      - updated_at
    RoutingResponsibilityWrite:
      type: object
      description: |-
        Create a rule: exactly one target and exactly one scope.

        Every id is looked up inside the caller's organization, so another tenant's
        team, employee or channel is simply "not found" and never confirmed to
        exist.
      properties:
        team_id:
          type: integer
          nullable: true
        employee_id:
          type: integer
          nullable: true
        provider:
          oneOf:
          - $ref: '#/components/schemas/RoutableProviderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        channel_connection_id:
          type: integer
          nullable: true
    SalesStageEnum:
      enum:
      - NEW_LEAD
      - LEAD
      - QUALIFIED_LEAD
      - HOT_LEAD
      - LOST
      - UNCERTAIN
      type: string
      description: |-
        * `NEW_LEAD` - New lead
        * `LEAD` - Lead
        * `QUALIFIED_LEAD` - Qualified lead
        * `HOT_LEAD` - Hot lead
        * `LOST` - Lost
        * `UNCERTAIN` - Uncertain
    SavedReply:
      type: object
      description: |-
        A reply as the composer and the settings screen render it.

        The owner is deliberately absent: a personal reply is only ever returned to
        its owner, so ``scope`` says everything a client needs.
      properties:
        id:
          type: integer
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        shortcut:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
        scope:
          allOf:
          - $ref: '#/components/schemas/SavedReplyScopeEnum'
          readOnly: true
        team:
          allOf:
          - $ref: '#/components/schemas/SavedReplyTeam'
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
        can_edit:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - can_edit
      - category
      - created_at
      - id
      - is_active
      - public_id
      - scope
      - shortcut
      - team
      - title
      - updated_at
    SavedReplyScopeEnum:
      enum:
      - personal
      - team
      - organization
      type: string
      description: |-
        * `personal` - Personal
        * `team` - Team
        * `organization` - Organization
    SavedReplyTeam:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    SavedReplyWrite:
      type: object
      description: |-
        Create or update a reply.

        ``scope`` and ``team_id`` are accepted on create only; a reply does not move
        between scopes. The owner of a personal reply is always the caller and is
        never read from the payload.
      properties:
        title:
          type: string
          maxLength: 120
        shortcut:
          type: string
          maxLength: 40
        body:
          type: string
          maxLength: 4096
        category:
          type: string
          maxLength: 60
        scope:
          $ref: '#/components/schemas/SavedReplyScopeEnum'
        team_id:
          type: integer
          nullable: true
        is_active:
          type: boolean
      required:
      - body
      - title
    SendTemplate:
      type: object
      description: |-
        Body for POST /api/conversations/{id}/send-template/.

        Note what is absent: no phone number id, no WABA, no access token. All three
        are resolved from the conversation, whose lookup is already scoped to the
        caller's organization.

        The parameter count is not validated here — it depends on the template,
        which is only known after Meta has been asked. The service does it.
      properties:
        template_name:
          type: string
          maxLength: 512
        language:
          type: string
          maxLength: 16
        parameters:
          type: array
          items:
            type: string
            maxLength: 1024
      required:
      - language
      - template_name
    SenderTypeEnum:
      enum:
      - CUSTOMER
      - AGENT
      - SYSTEM
      type: string
      description: |-
        * `CUSTOMER` - Customer
        * `AGENT` - Agent
        * `SYSTEM` - System
    SentimentEnum:
      enum:
      - positive
      - neutral
      - negative
      - mixed
      type: string
      description: |-
        * `positive` - Positive
        * `neutral` - Neutral
        * `negative` - Negative
        * `mixed` - Mixed
    SeverityEnum:
      enum:
      - INFO
      - WARNING
      - CRITICAL
      type: string
      description: |-
        * `INFO` - Information
        * `WARNING` - Needs attention
        * `CRITICAL` - Needs attention now
    Status:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ConversationStatusEnum'
      required:
      - status
    TaskMetrics:
      type: object
      properties:
        succeeded:
          type: integer
        failed:
          type: integer
        inline_fallbacks:
          type: integer
          description: Times the broker was unreachable and work ran inline instead.
        last_failure_at:
          type: string
          format: date-time
          nullable: true
        last_failure_detail:
          type: string
        degraded:
          type: boolean
      required:
      - degraded
      - failed
      - inline_fallbacks
      - last_failure_at
      - last_failure_detail
      - succeeded
    Team:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
        language:
          type: string
          maxLength: 10
        color:
          type: string
          maxLength: 7
        is_active:
          type: boolean
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
          readOnly: true
        leaders:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - leaders
      - member_count
      - members
      - name
      - public_id
      - updated_at
    TeamBlock:
      type: object
      description: |-
        Organization-wide staffing. Requires ``analytics.view``.

        Not narrowed by the caller's conversation scope: this reports on people, and
        a supervisor asking who is overloaded needs every agent in the answer.
      properties:
        online_agents:
          type: integer
        workload:
          type: array
          items:
            $ref: '#/components/schemas/TeamWorkloadRow'
          description: The ten busiest employees with at least one open conversation.
      required:
      - online_agents
      - workload
    TeamBrief:
      type: object
      description: |-
        Minimal team representation embedded in other payloads.

        Defined once, here, rather than per app. Two identical copies used to live
        in ``accounts`` and ``conversations``; being distinct classes with identical
        fields they produced two OpenAPI components competing for the same name,
        which is a schema that describes one concept twice and cannot say which is
        authoritative.
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
      required:
      - color
      - id
      - name
    TeamMember:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        availability:
          type: string
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        avatar_url:
          type: string
        initials:
          type: string
      required:
      - availability
      - avatar_url
      - email
      - full_name
      - id
      - initials
      - role
    TeamResponsibilityInput:
      type: object
      description: |-
        What the team handles on one channel.

        ``scope: "all"`` covers every account of ``provider``, including accounts
        connected later. ``scope: "selected"`` covers only ``channel_connection_ids``.
        A provider left out of the list has no responsibility for this team.
      properties:
        provider:
          $ref: '#/components/schemas/RoutableProviderEnum'
        scope:
          $ref: '#/components/schemas/TeamResponsibilityScopeEnum'
        channel_connection_ids:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 200
      required:
      - provider
      - scope
    TeamResponsibilityScopeEnum:
      enum:
      - all
      - selected
      type: string
      description: |-
        * `all` - All accounts
        * `selected` - Selected accounts
    TeamWorkloadRow:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        initials:
          type: string
        avatar_url:
          type: string
        availability:
          type: string
        open_conversations:
          type: integer
        unread_conversations:
          type: integer
      required:
      - availability
      - avatar_url
      - full_name
      - id
      - initials
      - open_conversations
      - unread_conversations
    TeamWrite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
        language:
          type: string
          maxLength: 10
        color:
          type: string
          maxLength: 7
        is_active:
          type: boolean
        member_ids:
          type: array
          items:
            type: integer
        leader_ids:
          type: array
          items:
            type: integer
        responsibilities:
          type: array
          items:
            $ref: '#/components/schemas/TeamResponsibilityInput'
      required:
      - id
      - name
    TemplateOutreachResult:
      type: object
      description: |-
        What an outbound-initiated template send answers with.

        Carries the conversation so the client can link straight to the thread the
        reply will arrive in, and `conversation_created` so it can say whether this
        opened a new one or added to an existing exchange.
      properties:
        message:
          $ref: '#/components/schemas/Message'
        conversation_id:
          type: integer
        conversation_created:
          type: boolean
          description: True when this send opened a thread that did not exist before.
        customer_id:
          type: integer
        customer_name:
          type: string
        wa_id:
          type: string
          description: The normalised recipient number the template was sent to, without
            a leading `+`.
      required:
      - conversation_created
      - conversation_id
      - customer_id
      - customer_name
      - message
      - wa_id
    TikTokAuthorizeRequest:
      type: object
      properties:
        return_path:
          type: string
          description: Client path to return to after the dialog. Defaults to `/settings`.
            Sealed into the signed state, so the callback cannot be redirected elsewhere
            by tampering with the query string.
    TikTokAuthorizeResponse:
      type: object
      properties:
        authorization_url:
          type: string
          description: |-
            Send the administrator's browser here. Points at TikTok's business account holder authorization page — not advertiser OAuth, which Business Messaging does not use.

            Carries `disable_auto_auth=1`: without it TikTok can redirect an already-authorised account straight back with no authorization code, leaving nothing to exchange for credentials.
      required:
      - authorization_url
    TikTokReadiness:
      type: object
      description: The post-connect Business Messaging check for one TikTok account.
      properties:
        state:
          $ref: '#/components/schemas/TikTokReadinessStateEnum'
        reason:
          type: string
        provider_code:
          type: integer
          nullable: true
        request_id:
          type: string
        log_id:
          type: string
        missing_scopes:
          type: array
          items:
            type: string
        checked_at:
          type: string
          format: date-time
          nullable: true
      required:
      - checked_at
      - log_id
      - missing_scopes
      - provider_code
      - reason
      - request_id
      - state
    TikTokReadinessStateEnum:
      enum:
      - READY
      - BLOCKED
      - UNKNOWN
      type: string
      description: |-
        * `READY` - READY
        * `BLOCKED` - BLOCKED
        * `UNKNOWN` - UNKNOWN
    UnhealthyChannel:
      type: object
      properties:
        name:
          type: string
        provider:
          type: string
      required:
      - name
      - provider
    WebhookMetrics:
      type: object
      properties:
        accepted:
          type: integer
        rejected:
          type: integer
        failed:
          type: integer
        error_rate:
          type: number
          format: double
      required:
      - accepted
      - error_rate
      - failed
      - rejected
    WhatsAppConnectRequest:
      type: object
      description: Manual connect, for a number provisioned in the Meta dashboard.
      properties:
        phone_number_id:
          type: string
        access_token:
          type: string
          writeOnly: true
          description: Verified against Graph before anything is stored, and encrypted
            at rest. Never returned by any endpoint.
        waba_id:
          type: string
          description: Optional. Derived from the token when omitted.
      required:
      - access_token
      - phone_number_id
    WhatsAppEmbeddedSignupRequest:
      type: object
      properties:
        code:
          type: string
          writeOnly: true
          description: Short-lived authorization code returned by the popup. Exchanged
            for a token server-side with the app secret.
        waba_id:
          type: string
        phone_number_id:
          type: string
        business_id:
          type: string
        coexistence:
          type: boolean
          default: false
          description: True when the WhatsApp Business app flow ran. Records how the
            number was onboarded; it does not influence which account is connected,
            which always comes from the exchanged token.
      required:
      - code
    WhatsAppEmbeddedSignupResponse:
      type: object
      properties:
        waba_id:
          type: string
          description: Re-derived from the exchanged token, never trusted from the
            request.
        business_id:
          type: string
          description: Owning business portfolio, read from Meta rather than the browser.
        connection_mode:
          type: string
          description: '`cloud_api` or `coexistence` — how these numbers were onboarded.'
        connected:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedChannel'
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal problems, e.g. a number that could not be subscribed.
      required:
      - business_id
      - connected
      - connection_mode
      - waba_id
      - warnings
    WhatsAppMobileSignupStartRequest:
      type: object
      properties:
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          default: cloud_api
          description: |-
            Which Meta onboarding flow to run. Anything else is read as cloud_api.

            * `cloud_api` - cloud_api
            * `coexistence` - coexistence
        return_path:
          type: string
          default: /settings
          description: 'Same-site path to return the browser to. Constrained server-side:
            anything that is not a plain /path is replaced with /settings.'
    WhatsAppMobileSignupStartResponse:
      type: object
      properties:
        authorization_url:
          type: string
          description: Meta's Embedded Signup dialog. Navigate the browser to it.
            Carries a signed single-use state; the authorization code returns to the
            server, never to the page.
      required:
      - authorization_url
    WhatsAppSignupAttemptRequest:
      type: object
      description: What the browser reports immediately before opening Meta's popup.
      properties:
        mode:
          type: string
          description: '`cloud_api` or `coexistence`. Exact match — an unknown value
            is refused rather than normalised, because the two launch different Meta
            products.'
        transport:
          type: string
          description: '`popup` or `redirect`. Diagnostic only.'
        selected_option:
          type: string
          description: '`existing_number` or `new_number` — which button was pressed.
            Recorded so a launch can be traced back to the customer''s intent, not
            only to the mode it resolved to.'
      required:
      - mode
    WhatsAppSignupConfig:
      type: object
      description: |-
        Public parameters the browser needs to launch Meta's Embedded Signup popup.

        Every value here is one Meta itself requires the browser to send. The app
        *secret* is what must never travel, and it does not.
      properties:
        enabled:
          type: boolean
          description: False when the deployment has no configuration id. The UI then
            offers only the manual form rather than a button that cannot work.
        app_id:
          type: string
        config_id:
          type: string
        graph_api_version:
          type: string
        coexistence_enabled:
          type: boolean
          description: Whether the WhatsApp Business app onboarding option may be
            offered. Meta selects that flow with a launch parameter rather than a
            different configuration, so this tracks `enabled`.
        coexistence_config_id:
          type: string
          description: Configuration id for the WhatsApp Business app flow. Normally
            equal to `config_id`; differs only when a deployment sets a separate one.
      required:
      - app_id
      - coexistence_config_id
      - coexistence_enabled
      - config_id
      - enabled
      - graph_api_version
    WhatsAppTemplate:
      type: object
      description: One template, as `TemplateSummary.as_dict` renders it.
      properties:
        id:
          type: string
          description: Meta's own template id.
        name:
          type: string
        language:
          type: string
        category:
          $ref: '#/components/schemas/WhatsAppTemplateCategoryEnum'
        status:
          type: string
          description: 'Meta''s vocabulary: APPROVED, PENDING, REJECTED, PAUSED, IN_APPEAL,
            DISABLED.'
        body:
          type: string
          maxLength: 1024
        rejected_reason:
          type: string
          description: Empty when nothing is wrong. Meta's literal `NONE` is normalised
            away here rather than in each client, because every consumer would otherwise
            have to know that `NONE` means no rejection.
        variables:
          type: integer
          description: How many values a send must supply — the highest `{{n}}` in
            the body, not the number of placeholders.
        can_send:
          type: boolean
          description: True only when APPROVED and `unsupported` is empty.
        unsupported:
          type: array
          items:
            type: string
          description: Components Scenario cannot supply values for — a media header,
            a dynamic URL button. Non-empty means the template exists and is approved
            but cannot be sent from here.
      required:
      - body
      - can_send
      - category
      - id
      - language
      - name
      - rejected_reason
      - status
      - unsupported
      - variables
    WhatsAppTemplateCategoryEnum:
      enum:
      - MARKETING
      - UTILITY
      - AUTHENTICATION
      type: string
      description: |-
        * `MARKETING` - MARKETING
        * `UTILITY` - UTILITY
        * `AUTHENTICATION` - AUTHENTICATION
    WhatsAppTemplateCreate:
      type: object
      description: |-
        Body for POST /api/integrations/whatsapp/{id}/templates/.

        Validated here as well as in the service layer, so a malformed request is a
        400 with field errors rather than a round trip to Meta that comes back as
        "Invalid parameter" with no indication of which one.

        Note what is *absent*: no WABA id and no access token. Both are resolved
        server-side from the channel the URL names, which is itself filtered by the
        caller's organization. A client that could name either could reach another
        tenant's account.
      properties:
        name:
          type: string
          pattern: ^[a-z0-9_]{1,512}$
        category:
          $ref: '#/components/schemas/WhatsAppTemplateCategoryEnum'
        language:
          type: string
          maxLength: 16
        body:
          type: string
          maxLength: 1024
        add_security_recommendation:
          type: boolean
          default: false
        code_expiration_minutes:
          type: integer
          maximum: 90
          minimum: 1
          nullable: true
        button_text:
          type: string
          maxLength: 25
      required:
      - category
      - language
      - name
    WhatsAppTemplateList:
      type: object
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/WhatsAppTemplate'
      required:
      - templates
    WhatsAppTemplateSend:
      type: object
      description: |-
        Body for POST /api/integrations/whatsapp/{id}/templates/send/.

        Exactly one recipient, named one of two ways: an existing customer, or a
        phone number typed by hand. Both are validated here so a malformed request
        is a 400 with field errors rather than a round trip to Meta.

        The sending number is **not** in this body. It is the channel in the URL,
        which is filtered by the caller's organization — a client that could name a
        phone number id could send from another tenant's account.
      properties:
        template_name:
          type: string
          maxLength: 512
        language:
          type: string
          maxLength: 16
        parameters:
          type: array
          items:
            type: string
            maxLength: 1024
        customer_id:
          type: integer
          nullable: true
        phone:
          type: string
          maxLength: 32
      required:
      - language
      - template_name
    WorkScheduleBrief:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        is_personal:
          type: boolean
          description: True for hours typed against this employee, false for a shared
            schedule.
        timezone:
          type: string
      required:
      - id
      - is_personal
      - name
      - timezone
    WorkingHoursWindow:
      type: object
      properties:
        weekday:
          type: integer
          description: 0 = Monday.
        start_time:
          type: string
          description: '`HH:MM`, in the schedule''s timezone.'
        end_time:
          type: string
          description: '`HH:MM`, in the schedule''s timezone.'
        crosses_midnight:
          type: boolean
      required:
      - crosses_midnight
      - end_time
      - start_time
      - weekday
    _ConnectionRef:
      type: object
      description: The account a rule names, by the name the admin recognises.
      properties:
        id:
          type: integer
        display_name:
          type: string
        provider:
          type: string
        is_active:
          type: boolean
      required:
      - display_name
      - id
      - is_active
      - provider
    _EmployeeRef:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        is_active:
          type: boolean
      required:
      - full_name
      - id
      - is_active
    _TeamRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        is_active:
          type: boolean
      required:
      - id
      - is_active
      - name
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: scenario_session
tags:
- name: auth
  description: Sign in, sign out, session and self-service profile.
- name: employees
  description: Employee directory, roles and availability.
- name: devices
  description: Mobile device registration for push notifications.
- name: conversations
  description: 'The inbox: threads, messages, notes, assignment, intelligence.'
- name: categories
  description: Per-organization conversation taxonomy.
- name: customers
  description: Customer records, known facts and history.
- name: orders
  description: Orders recorded against conversations.
- name: teams
  description: Teams and their membership.
- name: dashboard
  description: Live metrics and per-employee performance.
- name: channels
  description: Connected platform accounts.
- name: integrations
  description: Connecting and disconnecting Meta, WhatsApp and Instagram accounts.
- name: integrations-external
  description: 'Called by Meta, never by a Scenario client: the webhook receiver and
    the OAuth redirect target. Documented because they are real external contracts,
    tagged separately so client generation and contract diffs can leave them out.'
- name: health
  description: Liveness and readiness probe. Unauthenticated.
- name: metrics
  description: Operational metrics. Requires `channel.manage`.
- name: client-errors
  description: Browser crash reporting.
