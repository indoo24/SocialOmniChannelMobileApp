  /api/customers/export/:
    get:
      operationId: customers_export_retrieve
      description: |-
        The customers list as a UTF-8 CSV file (with a byte-order mark, for Excel), streamed. Accepts **every filter the list accepts** — `search`, `lifecycle_stage`, `preferred_language`, `country` and `field__<key>[__operator]` — and returns every matching row: `page` and `page_size` are ignored.

        Requires `crm.export` as well as `customer.view`. Columns are the customer's own attributes followed by one `custom_<key>` column per active custom field, in display order. Timestamps are ISO 8601 in the organization's timezone with their UTC offset. Text cells that a spreadsheet would run as a formula start with a single quote. An empty result is a file with only the header row.
