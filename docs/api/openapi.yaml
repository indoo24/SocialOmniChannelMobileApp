          type: string
          writeOnly: true
      required:
      - email
      - password
    LoginResponse:
      type: object
      description: |-
        What a successful login returns, alongside the session cookie.

        The token is repeated in the body so a client that has just authenticated
        can make its first write without a second round trip to `/api/auth/csrf/`.
      properties:
        employee:
