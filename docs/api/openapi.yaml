          type: string
          readOnly: true
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        currency:
          type: string
          readOnly: true
        created_at:
          type: string
