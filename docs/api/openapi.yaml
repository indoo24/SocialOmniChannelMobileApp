          type: string
        author_name:
          type: string
          readOnly: true
          default: ''
        author_initials:
          type: string
          readOnly: true
          default: ''
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
