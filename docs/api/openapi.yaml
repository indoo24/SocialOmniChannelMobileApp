      required:
      - is_follow_up
    HealthResponse:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/HealthStatusEnum'
          description: |-
            `degraded` means realtime delivery is failing but the service is still handling traffic, and is returned with HTTP 200 on purpose — failing the probe would remove a working container from the pool.

            * `ok` - ok
            * `degraded` - degraded
            * `unhealthy` - unhealthy
        database:
          type: boolean
        realtime:
          $ref: '#/components/schemas/RealtimeHealth'
      required:
      - database
      - realtime
      - status
    HealthStatusEnum:
      enum:
      - ok
      - degraded
      - unhealthy
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
        * `unhealthy` - unhealthy
    HoursBreakdown:
      type: object
      properties:
        scheduled_seconds:
          type: integer
        online_seconds:
          type: integer
        away_seconds:
          type: integer
        break_seconds:
          type: integer
        has_session_data:
          type: boolean
        adherence:
          type: number
          format: double
          nullable: true
      required:
      - adherence
      - away_seconds
      - break_seconds
      - has_session_data
      - online_seconds
      - scheduled_seconds
    InboxChannel:
      type: object
      description: |-
        The connected accounts an agent picks between, and nothing else.

        The Channels management screen has its own serializer in
        `apps.integrations`, and it carries token expiry, credential state,
        readiness and setup progress — everything an admin needs to fix a broken
        connection. None of that belongs in the inbox, and until now the only way
        to learn "which Pages exist?" was to ask for all of it, which is why three
        of five roles could not load their inbox at all.

        Four fields, matching exactly what the account picker reads, plus the mute
        flag so the UI can explain a quiet account without a second request. Adding
        a field here means deciding it is safe for every signed-in employee.
      properties:
        id:
          type: integer
          readOnly: true
        provider:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_muted:
          type: boolean
          readOnly: true
      required:
      - display_name
      - id
      - is_active
      - is_muted
      - provider
    IngestionMetrics:
      type: object
      properties:
        messages:
          type: integer
        messages_per_second:
          type: number
          format: double
          nullable: true
        p50_ms:
          type: number
          format: double
          nullable: true
        p95_ms:
          type: number
          format: double
          nullable: true
        window:
          type: integer
      required:
      - messages
      - messages_per_second
      - p50_ms
      - p95_ms
      - window
    InstagramAuthorizeRequest:
      type: object
      properties:
        return_path:
          type: string
          description: Client path to return to after the dialog. Defaults to `/settings`.
            Sealed into the signed state, so the callback cannot be redirected elsewhere
            by tampering with the query string.
        mode:
          type: string
          description: '`MIGRATE_TO_DIRECT` to move an existing Facebook-linked Instagram
            channel onto Instagram Login in place, keeping its conversations. Omit
            for the ordinary flow, which connects whichever account authorises.'
        connection_id:
          type: integer
          description: 'Required with `MIGRATE_TO_DIRECT`: the channel to migrate.
            The Instagram account it must come back as is resolved from this connection
            server-side and sealed into the signed state — the client never supplies
            an account id, and one sent back through the callback would be ignored.'
    InstagramAuthorizeResponse:
      type: object
      properties:
        authorization_url:
          type: string
          description: Send the administrator's browser here. Points at `https://www.instagram.com/oauth/authorize`
            — Business Login for Instagram, not the Facebook dialog.
      required:
      - authorization_url
    InstagramConnectRequest:
      type: object
      properties:
        access_token:
          type: string
          writeOnly: true
          description: An Instagram user token. The account id comes from Meta rather
            than from the caller — the token already identifies exactly one account.
      required:
      - access_token
    IntelligenceBlock:
      type: object
      description: |-
        Lead figures over the selected period.

        The stage and claim counts describe the **cohort** — conversations that
        began inside the period — as they stand now. There is no per-transition
        history of sales stage, so "became a hot lead in March" is not answerable;
        "arrived in March and is now a hot lead" is, and is what these report.
      properties:
        qualified_leads:
          type: integer
        hot_leads:
          type: integer
        purchase_claims:
          type: integer
          description: Unverified customer statements. Labelled as claims everywhere
            in the UI so nobody reads them as confirmed revenue.
        agent_confirmed_purchases:
          type: integer
          description: Confirmations recorded **during** this period, by `decided_at`
            on the audit row — an event, like `resolved`, not a current state.
        pending_review:
          type: integer
        average_lead_score:
          type: number
          format: double
      required:
      - agent_confirmed_purchases
      - average_lead_score
      - hot_leads
      - pending_review
      - purchase_claims
      - qualified_leads
    IntelligenceBrief:
      type: object
      description: Just enough intelligence for a list row — avoids shipping the full
        panel.
      properties:
        stage:
          type: string
        lead_score:
          type: integer
        purchase_status:
          type: string
        needs_human_review:
          type: boolean
      required:
      - lead_score
      - needs_human_review
      - purchase_status
      - stage
    IntensityLevelEnum:
      enum:
