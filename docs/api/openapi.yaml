            - INSTAGRAM
            - MOCK
            - TIKTOK
            - WHATSAPP
        description: |-
          * `TIKTOK` - TikTok
          * `INSTAGRAM` - Instagram
          * `FACEBOOK` - Facebook Messenger
          * `WHATSAPP` - WhatsApp Business
          * `MOCK` - Mock (development)
        explode: true
        style: form
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: stage
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - CLOSED
            - NEW
            - OPEN
            - RESOLVED
            - WAITING_CUSTOMER
            - WAITING_INTERNAL
        description: |-
