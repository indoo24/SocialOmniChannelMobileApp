      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this conversation.
        required: true
      - in: path
        name: message_id
        schema:
          type: integer
        description: Primary key of the message, which must belong to this conversation.
        required: true
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Removed. No response body.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
