openapi: 3.0.3
info:
  title: Scenario Omnichannel API
  version: 1.0.0
  description: |-
    Customer-service API for Scenario: one inbox across WhatsApp, Messenger and Instagram.

    ## Authentication

    Session cookies, not bearer tokens. `POST /api/auth/login/` sets an httpOnly `scenario_session` cookie; send it on every subsequent request.

    Unsafe methods (POST, PUT, PATCH, DELETE) additionally require a CSRF token in an **`X-CSRFToken`** header. Read it from the `scenario_csrftoken` cookie, or from the body of `GET /api/auth/csrf/` or the login response. This is not expressed in the `securitySchemes` below, which describe the session cookie only — a generated client must add the header itself.

    ## Authorization

    Every endpoint is scoped to the caller's organization, and most also require a named capability (`conversation.reply`, `channel.manage`, ...). `GET /api/auth/me/` returns the caller's full capability list.

    A resource belonging to another organization answers **404, not 403** — a 403 would confirm that the row exists.

    ## Errors

    Every failure has one shape:

    ```json
    {"error": {"code": "validation_error", "message": "...", "details": {}}}
    ```

    `details` carries `{field: [message, ...]}` for validation failures and is an empty object otherwise.

    ## Pagination

    List endpoints are page-numbered: `?page=` and `?page_size=` (capped per endpoint). The envelope carries `count`, `page`, `page_size`, `total_pages`, `next`, `previous` and `results`. Several sub-resources return a plain array instead; each says so in its own description.

    ## Realtime

    Live inbox updates arrive over a WebSocket, which OpenAPI cannot describe. That contract is documented separately — nothing in this document covers it.
paths:
  /api/attachments/{public_id}/content/:
    get:
      operationId: attachment_content
      description: |-
        Returns the stored bytes of an attachment the caller is allowed to see.

        Authorization is the attachment's organization and the conversation's visibility rules — never the URL, which is only an identifier. An attachment belonging to another organization answers **404**, not 403, so ids cannot be probed for existence.

        Supports `Range` for audio and video seeking. Only `READY` attachments have bytes; anything else answers 409.
      summary: Download or stream one attachment
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '200':
          description: The file.
        '206':
          description: A byte range of the file.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such attachment for this organization.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The attachment is not ready.
  /api/auth/availability/:
    post:
      operationId: auth_availability
      description: Drives routing eligibility and the team presence panel. Returns
        the whole employee so a client can redraw from one payload.
      summary: Set your availability
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Availability'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Availability'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Availability'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentEmployee'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unknown availability value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
  /api/auth/csrf/:
    get:
      operationId: auth_csrf
      description: Sets the `scenario_csrftoken` cookie and returns the same value
        in the body. Call this before the first unsafe request of a session; every
        POST/PATCH/PUT/DELETE must carry the token in an `X-CSRFToken` header.
      summary: Prime the CSRF cookie
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login
      description: |-
        Starts a session and sets the `scenario_session` cookie. The response body carries the employee and a CSRF token, so a client can make its first write without a further round trip.

        Signing in moves an OFFLINE employee to ONLINE.

        Throttled to 10/min. Wrong password, unknown address and deactivated account are deliberately indistinguishable, so this endpoint cannot be used to discover which addresses exist.
      summary: Sign in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid credentials, or an account with no organization.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Rate limit exceeded (10/min).
  /api/auth/logout/:
    post:
      operationId: auth_logout
      description: Clears the session cookie and sets the employee OFFLINE. Takes
        no request body.
      summary: Sign out
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Signed out. No response body.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Includes `permissions`, the capability list the client uses to
        hide controls. It mirrors the server's rules for presentation only — every
        one of them is re-checked on the request itself.
      summary: The signed-in employee
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentEmployee'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
    patch:
      operationId: auth_me_update
      description: 'Accepts the employee write body, but `role`, `is_active` and `team_ids`
        are **discarded** rather than rejected: nobody may promote themselves through
        this route. Use `PATCH /api/employees/{id}/` (requires `employee.manage`)
        to change those.'
      summary: Edit your own profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentEmployee'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
  /api/auth/password/:
    post:
      operationId: auth_password_change
      description: Requires the current password. The session survives the change,
        so the client does not need to sign in again.
      summary: Change your own password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Password changed. No response body.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The current password was wrong, or the new one failed validation.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
  /api/categories/:
    get:
      operationId: categories_list
      description: Every active employee may read the taxonomy, including QA. Returned
        as a plain array — **not paginated**.
      summary: List conversation categories
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
    post:
      operationId: categories_create
      description: Requires `team.manage`.
      summary: Create a category
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
  /api/categories/{id}/:
    get:
      operationId: categories_retrieve
      description: |-
        Per-organization conversation taxonomy.

        Reads are open to any active employee. Categories are labels on the inbox —
        every role that can see a conversation has to be able to render and filter
        by its category, including QA, which reviews history but holds no
        conversation-write capability at all. Gating the list on
        ``conversation.change_category`` (as this once did) meant a reviewer's inbox
        filters 403'd on a taxonomy that is not sensitive in the first place.

        Writes stay admin-level.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this conversation category.
        required: true
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such resource inside the caller's organization. Cross-tenant
            reads are reported as 404 rather than 403, so the response never confirms
            that a row exists.
    put:
      operationId: categories_update
      description: |-
        Per-organization conversation taxonomy.

        Reads are open to any active employee. Categories are labels on the inbox —
        every role that can see a conversation has to be able to render and filter
        by its category, including QA, which reviews history but holds no
        conversation-write capability at all. Gating the list on
        ``conversation.change_category`` (as this once did) meant a reviewer's inbox
        filters 403'd on a taxonomy that is not sensitive in the first place.

        Writes stay admin-level.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this conversation category.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such resource inside the caller's organization. Cross-tenant
            reads are reported as 404 rather than 403, so the response never confirms
            that a row exists.
    patch:
      operationId: categories_partial_update
      description: |-
        Per-organization conversation taxonomy.

        Reads are open to any active employee. Categories are labels on the inbox —
        every role that can see a conversation has to be able to render and filter
        by its category, including QA, which reviews history but holds no
        conversation-write capability at all. Gating the list on
        ``conversation.change_category`` (as this once did) meant a reviewer's inbox
        filters 403'd on a taxonomy that is not sensitive in the first place.

        Writes stay admin-level.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this conversation category.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such resource inside the caller's organization. Cross-tenant
            reads are reported as 404 rather than 403, so the response never confirms
            that a row exists.
    delete:
      operationId: categories_destroy
      description: Requires `team.manage`. **Deactivates rather than deletes**, because
        conversations reference categories. A system category cannot be removed at
        all.
      summary: Deactivate a category
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this conversation category.
        required: true
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Deactivated. No response body.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: System categories cannot be deleted.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such resource inside the caller's organization. Cross-tenant
            reads are reported as 404 rather than 403, so the response never confirms
            that a row exists.
  /api/channels/:
    get:
      operationId: channels_list
      description: |-
        Paginated. Requires `channel.view`. Archived channels are excluded everywhere on this viewset, so an archived channel is a 404 on every route rather than a row each action has to remember to skip.

        No token or secret appears in this payload. `token_expires_at` is metadata about a credential, written by the hourly sweep from Meta's own `debug_token`.
      summary: List channel connections
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: provider
        schema:
          type: string
          enum:
          - FACEBOOK
          - INSTAGRAM
          - MOCK
          - TIKTOK
          - WHATSAPP
        description: |-
          * `TIKTOK` - TikTok
          * `INSTAGRAM` - Instagram
          * `FACEBOOK` - Facebook Messenger
          * `WHATSAPP` - WhatsApp Business
          * `MOCK` - Mock (development)
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CONNECTED
          - DEGRADED
          - DISCONNECTED
          - ERROR
          - PENDING
        description: |-
          * `PENDING` - Pending setup
          * `CONNECTED` - Connected
          * `DEGRADED` - Degraded
          * `DISCONNECTED` - Disconnected
          * `ERROR` - Error
      tags:
      - channels
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChannelConnectionList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
    post:
      operationId: channels_create
      description: Requires `channel.manage`. `configuration` rejects anything that
        looks like a credential — those are written server-side by the OAuth callback
        and never through this route.
      summary: Record a channel connection
      tags:
      - channels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelConnectionWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChannelConnectionWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChannelConnectionWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConnection'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
  /api/channels/{id}/:
    get:
      operationId: channels_retrieve
      description: |-
        Applies the tenant filter before anything else can widen it.

        Subclasses override :meth:`get_base_queryset` (not ``get_queryset``) so the
        organization filter can never be accidentally dropped by an override.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel connection.
        required: true
      tags:
      - channels
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConnection'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such resource inside the caller's organization. Cross-tenant
            reads are reported as 404 rather than 403, so the response never confirms
            that a row exists.
    put:
      operationId: channels_update
      description: |-
        Applies the tenant filter before anything else can widen it.

        Subclasses override :meth:`get_base_queryset` (not ``get_queryset``) so the
        organization filter can never be accidentally dropped by an override.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel connection.
        required: true
      tags:
      - channels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelConnectionWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChannelConnectionWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChannelConnectionWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConnection'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such resource inside the caller's organization. Cross-tenant
            reads are reported as 404 rather than 403, so the response never confirms
            that a row exists.
    patch:
      operationId: channels_partial_update
      description: |-
        Applies the tenant filter before anything else can widen it.

        Subclasses override :meth:`get_base_queryset` (not ``get_queryset``) so the
        organization filter can never be accidentally dropped by an override.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel connection.
        required: true
      tags:
      - channels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChannelConnectionWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChannelConnectionWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChannelConnectionWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConnection'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such resource inside the caller's organization. Cross-tenant
            reads are reported as 404 rather than 403, so the response never confirms
            that a row exists.
    delete:
      operationId: channels_destroy
      description: |-
        Requires `channel.manage`. **The channel must already be disconnected** — deleting a live one would destroy its credential and drop its webhook subscription as a side effect of a button labelled delete, and Meta does not replay what it was never asked to deliver.

        Conversations are always preserved. A channel with no conversations is erased; one with conversations is archived, keeping every thread's provider badge, channel name and history. Both answer 204, because from the caller's side both are the same event.
      summary: Remove a disconnected channel
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel connection.
        required: true
      tags:
      - channels
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Removed or archived. No response body.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such resource inside the caller's organization. Cross-tenant
            reads are reported as 404 rather than 403, so the response never confirms
            that a row exists.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The channel is still connected. Disconnect it first.
  /api/channels/{id}/mute/:
    post:
      operationId: channels_mute_create
      description: |-
        Requires `channel.manage`. Hides this channel's conversations from the inbox and its badges without touching ingestion — messages keep arriving, keep being stored and keep being analysed.

        This is the reversible opposite of disconnecting, which unsubscribes the webhook and loses everything sent in the meantime.
      summary: Mute a channel
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel connection.
        required: true
      tags:
      - channels
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConnection'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such resource inside the caller's organization. Cross-tenant
            reads are reported as 404 rather than 403, so the response never confirms
            that a row exists.
  /api/channels/{id}/test/:
    post:
      operationId: channels_test_create
      description: |-
        Runs the provider's liveness check and updates the stored status. Requires `channel.manage`.

        Always 200: a failed check is a **result**, reported as `ok: false` with the provider's explanation, not an HTTP error. Platforms that are not implemented yet say so plainly rather than reporting a misleading success.
      summary: Test a channel connection
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel connection.
        required: true
      tags:
      - channels
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConnectionTestResult'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such resource inside the caller's organization. Cross-tenant
            reads are reported as 404 rather than 403, so the response never confirms
            that a row exists.
  /api/channels/{id}/unmute/:
    post:
      operationId: channels_unmute_create
      description: Requires `channel.manage`. Reveals the whole backlog at once, because
        none of it was ever missing.
      summary: Unmute a channel
      parameters:
      - in: path
