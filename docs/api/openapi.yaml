  /api/conversations/{id}/reply/:
    post:
      operationId: conversations_reply_create
      description: |-
        Sends through the conversation's own channel provider and returns the stored message. Requires `conversation.reply`. Throttled to 120/min.

        A provider refusal — an expired token, a closed WhatsApp service window — comes back as 400 carrying the platform's own explanation.
