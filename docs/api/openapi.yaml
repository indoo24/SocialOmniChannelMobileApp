  /api/conversations/{id}/follow-up/:
    post:
      operationId: conversations_follow_up_create
      description: |-
        Shared conversation state, not a private bookmark: everyone who can see the conversation sees the same flag, and it survives reassignment.

        `follow_up_date` is three-valued. **Omit it** to keep the date already stored, send **`null`** to clear the date while keeping the conversation flagged, or send a `YYYY-MM-DD` date to set it. A past date is accepted — this is an organisational label, not a deadline.

        Sending `is_follow_up: false` clears the flag, the date and the audit metadata together.

        **Nothing is scheduled by this.** There is no reminder, no notification and no automatic unflagging; a new customer message, an agent reply, a reassignment and a status change all leave the flag untouched. It stays until somebody removes it.

        Requires `conversation.change_category` — the capability that already governs organisational labelling, held by every role that works conversations and withheld from QA.
