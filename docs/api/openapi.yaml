  /api/health/:
    get:
      operationId: health_check
      description: |-
        Unauthenticated on purpose — a probe cannot hold a session. Reports the database and realtime delivery.

        A realtime outage is reported as **200 with `status: "degraded"`**, not 503: messages still arrive and agents can still reply, so failing the probe would turn a partial degradation into a full outage. Only a database failure returns 503.
      summary: Liveness and readiness probe
      tags:
      - health
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Database reachable. `status` is `ok` or `degraded`.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Database unreachable. `status` is `unhealthy`.
  /api/integrations/instagram/{id}/disconnect/:
    post:
      operationId: instagram_disconnect
      description: Requires `channel.manage`. Destroys the stored credential; the
        connection row and every conversation it carried survive.
      summary: Disconnect an Instagram channel
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - integrations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionState'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such Instagram channel in this organization.
  /api/integrations/instagram/authorize/:
    post:
      operationId: instagram_authorize
      description: |-
        Requires `channel.manage`. Returns the URL to send the administrator's browser to.

        This is **Business Login for Instagram** — `instagram.com/oauth/authorize` — and requests only `instagram_business_basic` and `instagram_business_manage_messages`. It is a different product from the Facebook dialog at `/api/integrations/meta/connect/`, which reaches Instagram through a linked Page and uses a different permission vocabulary.

        The organization is taken from the session and sealed into a signed, expiring state token; nothing the browser sends back can change it.
      summary: Begin Business Login for Instagram
      tags:
      - integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstagramAuthorizeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InstagramAuthorizeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InstagramAuthorizeRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramAuthorizeResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Instagram Login is not configured on this deployment — the
            app id, secret or redirect URI is unset; or `MIGRATE_TO_DIRECT` named
            a channel that is not on the Facebook-linked Instagram path.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
  /api/integrations/instagram/callback/:
    get:
      operationId: instagram_oauth_callback
      description: |-
        Instagram redirects the administrator's browser here after the consent screen. Unauthenticated by necessity — a redirect carries no session — and CSRF-exempt for the same reason.

        The signed `state` is the only trusted input. It must have been minted by `/api/integrations/instagram/authorize/`: a state from the Facebook flow is refused, so the two dialogs cannot answer each other's redirects.

        The authorization code is exchanged server-side for a short-lived token and immediately extended to a 60-day one. **Always answers 302**, back to the frontend with `instagram_connect=success|error` and a `detail` message — including on failure, because a browser needs a page. No token ever reaches the query string.
      summary: Business Login for Instagram redirect target
      parameters:
      - in: query
        name: code
        schema:
          type: string
        description: Instagram authorization code.
      - in: query
        name: error
        schema:
          type: string
        description: Present when the administrator cancelled.
      - in: query
        name: error_description
        schema:
          type: string
        description: Instagram's explanation, if any.
      - in: query
        name: state
        schema:
          type: string
        description: The signed state issued by the authorize call.
      tags:
      - integrations-external
      security:
      - {}
      responses:
        '302':
          description: Redirect to the frontend carrying `instagram_connect` and `detail`.
            Returned for both success and failure.
  /api/integrations/instagram/connect/:
    post:
      operationId: instagram_connect
      description: 'Requires `channel.manage`. Instagram Login is a distinct API from
        the Page-based flow: an Instagram user token against `graph.instagram.com`.
        Meta''s dashboard ''Generate token'' button is the sanctioned way to obtain
        one for a tester account, so it is pasted here rather than obtained through
        an OAuth dance.'
      summary: Attach an Instagram account by token
      tags:
      - integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstagramConnectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InstagramConnectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InstagramConnectRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedChannel'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`access_token` missing, or Meta rejected it.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
  /api/integrations/meta/{id}/disconnect/:
    post:
      operationId: meta_disconnect
      description: |-
        Requires `channel.manage`. Unsubscribes the webhook and destroys the stored credential.

        The connection row survives, deactivated, so every conversation it carried stays readable — nothing can be sent or received on it.
      summary: Disconnect a Messenger or Instagram channel
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - integrations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionState'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such Messenger or Instagram channel in this organization.
  /api/integrations/meta/callback/:
    get:
      operationId: meta_oauth_callback
      description: |-
        Meta redirects the admin's browser here after the consent dialog. Not called by a client, and unauthenticated by necessity — a redirect carries no session.

        The signed `state` is the only trusted input; everything else in the query string is attacker-controllable. **Always answers 302**, back to the frontend with `meta_connect=success|error` and a `detail` message — including on failure, because the browser needs a page, not a status code.
      summary: Meta OAuth redirect target
      parameters:
      - in: query
        name: code
        schema:
          type: string
        description: Meta authorization code.
      - in: query
        name: error
        schema:
          type: string
        description: Present when the admin cancelled or Meta refused.
      - in: query
        name: error_description
        schema:
          type: string
        description: Meta's explanation, if any.
      - in: query
        name: state
        schema:
          type: string
        description: The signed state token issued by `/api/integrations/meta/connect/`.
      tags:
      - integrations-external
      security:
      - {}
      responses:
        '302':
          description: Redirect to the frontend carrying `meta_connect` and `detail`
            query parameters. Returned for both success and failure.
  /api/integrations/meta/connect/:
    post:
      operationId: meta_connect_start
      description: |-
        Requires `channel.manage`. Returns the URL to send the admin's browser to.

        The organization is taken from the session and sealed into a signed, expiring state token — nothing the browser sends back can change it.
      summary: Begin the Meta OAuth flow
      tags:
      - integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetaConnectStartRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MetaConnectStartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MetaConnectStartRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaConnectStartResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Meta app credentials are not configured on this deployment.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
  /api/integrations/meta/webhook/:
    get:
      operationId: meta_webhook_verify
      description: Called by Meta, not by a client. Echoes `hub.challenge` as `text/plain`
        **only** when `hub.verify_token` matches the configured secret — echoing it
        unconditionally would let anyone point their own Meta app here and start delivering
        forged events.
      summary: Meta webhook subscription handshake
      parameters:
      - in: query
        name: hub.challenge
        schema:
          type: string
        description: Echoed back verbatim on success.
      - in: query
        name: hub.mode
        schema:
          type: string
        description: Always `subscribe`.
      - in: query
        name: hub.verify_token
        schema:
          type: string
        description: Must match the configured secret.
      tags:
      - integrations-external
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: '`text/plain` echo of `hub.challenge`.'
        '403':
          content:
            application/json:
              schema:
                type: string
          description: Verify token did not match.
        '503':
          content:
            application/json:
              schema:
                type: string
          description: SCENARIO_META_WEBHOOK_VERIFY_TOKEN is not configured.
    post:
      operationId: meta_webhook_receive
      description: |-
        Called by Meta, not by a client. Carries Messenger, Instagram and WhatsApp events; the body shape is Meta's and is documented by Meta, so it is deliberately left opaque here rather than pinned to a snapshot that would rot.

        Authentication is the `X-Hub-Signature-256` HMAC over the raw body, checked before the payload is parsed. Unsigned or wrongly signed requests get 403 and are never ingested.

        Answers 200 for events Scenario does not handle, so Meta stops retrying rather than queueing them forever.
      summary: Inbound Meta webhook events
      parameters:
      - in: header
        name: X-Hub-Signature-256
        schema:
          type: string
        description: '`sha256=<hmac>` over the raw request body, keyed with the app
          secret.'
        required: true
      tags:
      - integrations-external
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - {}
      responses:
        '200':
          description: Accepted. Empty body.
        '403':
          description: Signature missing or invalid. Nothing was ingested.
        '503':
          description: Meta app credentials are not configured.
  /api/integrations/tiktok/{id}/disconnect/:
    post:
      operationId: tiktok_disconnect
      description: |-
        Requires `channel.manage`. Destroys the stored credentials and deactivates the channel; conversations and message history survive.

        Nothing is sent to TikTok. The webhook subscription belongs to the developer app rather than to this account, so revoking anything here would silence every other connected business. The account holder can withdraw the authorization from their own TikTok settings.
      summary: Disconnect a TikTok account
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - integrations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionState'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such TikTok channel in this organization.
  /api/integrations/tiktok/account/callback/:
    get:
      operationId: tiktok_account_callback
      description: |-
        TikTok redirects the administrator's browser here after the consent screen. Unauthenticated by necessity — a redirect carries no session — and CSRF-exempt for the same reason.

        The signed `state` is the only trusted input; the organization comes from it, never from the query string. **Always answers 302**, back to the frontend with `tiktok_connect=success|error` and a `detail` message, because a browser needs a page even when the flow failed. No token ever reaches the query string.

        A callback with no `code` is treated as a failure: TikTok can redirect without one when the account already granted these permissions, and that leaves nothing to exchange.
      summary: TikTok account holder redirect target
      parameters:
      - in: query
        name: code
        schema:
          type: string
        description: Single-use authorization code, valid 10 minutes.
      - in: query
        name: error
        schema:
          type: string
        description: Present when the account holder declined.
      - in: query
        name: state
        schema:
          type: string
        description: The signed state minted by the authorize call.
      tags:
      - integrations-external
      security:
      - {}
      responses:
        '302':
          description: Always a redirect back to Settings → Channels.
  /api/integrations/tiktok/authorize/:
    post:
      operationId: tiktok_authorize
      description: |-
        Requires `channel.manage`. Returns the URL to send the administrator's browser to.

        The organization is taken from the session and sealed into a signed, expiring `state`, so the account that comes back can only ever be attached to the workspace that started the flow. The app secret stays on the server; the browser receives a URL and nothing else.
      summary: Start TikTok Business Account authorization
      tags:
      - integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TikTokAuthorizeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TikTokAuthorizeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TikTokAuthorizeRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TikTokAuthorizeResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: TikTok is not configured on this deployment.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
  /api/integrations/tiktok/webhook/:
    post:
      operationId: tiktok_webhook
      description: |-
        Called by TikTok, not by a client. Subscriptions are registered per *developer app*, so one endpoint receives events for every business that authorises Scenario.

        Authentication is the `Tiktok-Signature` HMAC over the raw body, checked before the payload is parsed. Unsigned, wrongly signed or stale requests get 403 and are never ingested.

        Answers 200 for events Scenario does not handle so TikTok stops retrying rather than queueing them forever.
      summary: Inbound TikTok Business Messaging events
      parameters:
      - in: header
        name: Tiktok-Signature
        schema:
          type: string
        description: '`t=<unix seconds>,s=<hex hmac>` over `"{t}." + raw body`.'
        required: true
      tags:
      - integrations-external
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - {}
      responses:
        '200':
          description: Accepted. Empty body.
        '403':
          description: Signature missing, invalid or stale. Nothing ingested.
        '503':
          description: TikTok app credentials are not configured.
  /api/integrations/whatsapp/{id}/check-status/:
    post:
      operationId: whatsapp_check_status
      description: |-
        Requires `channel.manage`. Asks Meta whether this number can send and receive yet, and updates the channel accordingly.

        For the customer this is the button they press after finishing onboarding in the WhatsApp Business app, rather than waiting up to an hour for the background sweep. It is a **read** — it changes nothing at Meta, creates no session and sends no message. Rate limited, because somebody waiting will press it repeatedly and each press is one Graph call.
      summary: Re-read a WhatsApp number's readiness from Meta
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - integrations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedChannel'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such WhatsApp channel in this organization.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Meta could not be reached. Nothing changed.
  /api/integrations/whatsapp/{id}/disconnect/:
    post:
      operationId: whatsapp_disconnect
      description: Requires `channel.manage`. Destroys the stored credential, keeping
        every conversation the number carried.
      summary: Disconnect a WhatsApp channel
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - integrations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionState'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such WhatsApp channel in this organization.
  /api/integrations/whatsapp/{id}/templates/:
    get:
      operationId: whatsapp_templates_list
      description: |-
        Read live from Meta each time — a template approved thirty seconds ago is listed now. Requires `channel.view`.

        Templates belong to the WhatsApp Business Account behind the channel, and the WABA is resolved server-side from the channel the URL names. A client that could supply a WABA id could read another tenant's templates.
      summary: List WhatsApp message templates
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - integrations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppTemplateList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Meta refused the request — usually an expired or invalid token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such WhatsApp channel in this organization. A channel belonging
            to another tenant is reported as 404, never 403.
    post:
      operationId: whatsapp_templates_create
      description: |-
        Requires `channel.manage` — a second gate above the `channel.view` needed to list, because submitting a template is an outward act on the business account rather than a local one.

        Meta accepts the template as `PENDING` and reviews it asynchronously; a 201 here means submitted, not approved. Names must be unique on the account — Meta rejects a duplicate outright.
      summary: Submit a WhatsApp message template for review
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplateCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplateCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplateCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppTemplate'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failed, or Meta refused the submission.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Listing needs `channel.view`; creating needs `channel.manage`.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such WhatsApp channel in this organization.
  /api/integrations/whatsapp/{id}/templates/send/:
    post:
      operationId: whatsapp_templates_send
      description: |-
        Sends from the channel named in the URL, which may be a **different number from the one the customer last spoke to** — that is the point of this route.

        Name exactly one recipient: `customer_id` for somebody already in the system, whose WhatsApp number is resolved server-side, or `phone` for a number typed by hand. A typed number must carry its country code; a local number beginning with `0` is refused rather than guessed at, because guessing would risk messaging a stranger.

        The conversation is opened if it does not exist, keyed the same way the inbound webhook keys it, so the customer's reply lands in this thread. A resolved or closed thread is reopened.

        Requires `channel.view` **and** `conversation.reply`. Throttled with the ordinary message-send limit.

        Approval, language and parameter count are all checked against Meta at send time, exactly as they are for an in-conversation send.
      summary: Send an approved template to a customer or a phone number
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplateSend'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplateSend'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplateSend'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateOutreachResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failed, the number is not usable, the customer has
            no WhatsApp number on file, the template is not APPROVED, the parameter
            count is wrong, or Meta refused the send.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reaching the channel needs `channel.view`; sending needs `conversation.reply`.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such WhatsApp channel, or no such customer, in this organization.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Rate limit exceeded.
  /api/integrations/whatsapp/connect/:
    post:
      operationId: whatsapp_connect
      description: |-
        Requires `channel.manage`. The manual alternative to Embedded Signup, for a number provisioned in the Meta dashboard.

        The token is verified against Graph **before** anything is stored — saving an unusable credential would produce a channel that looks connected and fails on the first reply.
      summary: Attach a WhatsApp number by id and token
      tags:
      - integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppConnectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WhatsAppConnectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WhatsAppConnectRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedChannel'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`phone_number_id` or `access_token` missing, or Graph rejected
            the token.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Already connected to another workspace, or connected through
            a different onboarding mode.
  /api/integrations/whatsapp/embedded-signup/:
    post:
      operationId: whatsapp_embedded_signup
      description: |-
        Requires `channel.manage`. Exchanges the popup's short-lived code for a token server-side, so the admin never handles one.

        The organization comes from the session and the WABA is re-derived from the exchanged token, so neither field can be used to attach an account the authorising business did not actually grant.
      summary: Complete WhatsApp Embedded Signup
      tags:
      - integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppEmbeddedSignupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WhatsAppEmbeddedSignupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WhatsAppEmbeddedSignupRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppEmbeddedSignupResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`code` missing, or Meta rejected the exchange.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Every granted number is already connected — to another workspace,
            or through a different onboarding mode.
  /api/integrations/whatsapp/embedded-signup/attempt/:
    post:
      operationId: whatsapp_signup_attempt
      description: |-
        Requires `channel.manage`. Records which onboarding option the administrator chose, immediately before the browser opens Meta's popup.

        **Writes nothing.** No connection, no credential, no OAuth state, and no call to Meta — it exists so that a signup which fails *inside* Meta's window still leaves a record of what was asked for. The redirect transport gets this for free because it asks the server for a URL; the popup transport talks to Meta directly, so without this the most common failure mode is invisible.

        The mode is validated exactly as the redirect route validates it, so an unknown value is refused here too rather than being recorded as something the caller did not ask for.
      summary: Record that a WhatsApp signup is about to open
      tags:
      - integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppSignupAttemptRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WhatsAppSignupAttemptRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WhatsAppSignupAttemptRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Recorded.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The signup mode is missing or not recognised.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
  /api/integrations/whatsapp/embedded-signup/mobile/start/:
    post:
      operationId: whatsapp_embedded_signup_mobile_start
      description: |-
        Requires `channel.manage`. Returns the Meta Embedded Signup dialog as a URL to navigate to, for browsers where the SDK navigates the tab instead of opening a popup — which destroys the page holding the SDK callback.

        The organization is taken from the session and sealed into a signed, single-use state. Meta returns the authorization code to `/api/integrations/meta/callback/`, so completion does not depend on the calling page still existing.
      summary: Begin WhatsApp Embedded Signup on a device without popups
      tags:
      - integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppMobileSignupStartRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WhatsAppMobileSignupStartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WhatsAppMobileSignupStartRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppMobileSignupStartResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Embedded Signup is not configured on this deployment.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
  /api/integrations/whatsapp/signup-config/:
    get:
