    ConversationCountsBlock:
      type: object
      description: |-
        Status buckets over the selected period, scoped to the caller.

        Muted channels are excluded: these describe work the team is expected to do.

        Everything except `resolved` counts the **cohort** — conversations that
        began inside the period — as it stands now. `open` therefore means "started
        in this period and still open". The stronger reading, "was open at some
        point during the period", would need a history of status over time that this
        database does not keep.
      properties:
        open:
          type: integer
          description: Started in this period and currently open.
        new:
          type: integer
          description: Started in this period and still untouched.
        unassigned:
          type: integer
          description: Started in this period and currently unassigned.
        waiting:
          type: integer
          description: Started in this period and currently waiting.
        resolved:
          type: integer
          description: Resolved **during** this period, by `resolved_at` — not by
            when the conversation began. A thread opened in March and resolved today
            counts today.
        unread:
          type: integer
          description: Started in this period and currently carrying unread messages.
        mine_open:
          type: integer
          description: Started in this period, assigned to the caller, still open.
      required:
      - mine_open
      - new
      - open
      - resolved
      - unassigned
      - unread
      - waiting
