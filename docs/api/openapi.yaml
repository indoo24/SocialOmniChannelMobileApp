  /api/channels/providers/:
    get:
      operationId: channels_providers_list
      description: One entry per provider. `is_operational` is false for platforms
        that can be recorded but cannot yet exchange messages, which keeps the Channels
        screen honest about the difference. A plain array — **not paginated**.
      summary: Catalog of supported platforms
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: provider
        schema:
          type: string
          enum:
          - FACEBOOK
          - INSTAGRAM
          - MOCK
          - TIKTOK
          - WHATSAPP
        description: |-
          * `TIKTOK` - TikTok
          * `INSTAGRAM` - Instagram
          * `FACEBOOK` - Facebook Messenger
          * `WHATSAPP` - WhatsApp Business
          * `MOCK` - Mock (development)
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CONNECTED
          - DEGRADED
          - DISCONNECTED
          - ERROR
          - PENDING
        description: |-
          * `PENDING` - Pending setup
          * `CONNECTED` - Connected
          * `DEGRADED` - Degraded
          * `DISCONNECTED` - Disconnected
          * `ERROR` - Error
