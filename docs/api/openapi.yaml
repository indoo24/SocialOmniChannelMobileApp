    delete:
      operationId: conversations_messages_destroy
      description: |-
        Requires `conversation.delete_message` (ADMIN and SUPERVISOR). Soft delete: the row survives for audit and webhook idempotency but stops being served.

        This does **not** unsend the message on the platform — the customer still has it.

        An optional JSON body `{"reason": "..."}` is recorded on the audit event. It is not shown as a request schema below because OpenAPI tooling does not model a body on DELETE.
