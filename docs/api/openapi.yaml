  /api/conversations/{id}/send-template/:
    post:
      operationId: conversations_send_template_create
      description: |-
        The only way to reach a customer after the 24-hour service window closes. WhatsApp conversations only.

        Approval is checked against Meta at send time rather than locally, so a template approved seconds ago is usable immediately and one paused by Meta is refused even if it was approved when the client last looked. `parameters` must supply exactly as many values as the template body has `{{n}}` placeholders.

        Requires `conversation.reply` — the same capability as an ordinary reply, because this is a message to a customer and not an administrative act on the business account.
      summary: Send an approved WhatsApp template
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this conversation.
        required: true
      tags:
      - conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTemplate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendTemplate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendTemplate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Not a WhatsApp conversation, the channel is disconnected, the
            template is unknown or not APPROVED, the language has no version, the
            parameter count is wrong, or Meta refused the send.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such resource inside the caller's organization. Cross-tenant
            reads are reported as 404 rather than 403, so the response never confirms
            that a row exists.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Rate limit exceeded (120/min).
