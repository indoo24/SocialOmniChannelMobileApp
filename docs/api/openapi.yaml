  /api/conversations/channels/:
    get:
      operationId: conversations_channels_list
      description: |-
        The accounts an agent can scope their inbox to: id, provider, display name, active and muted flags.

        Deliberately separate from `/channels/`, which requires `channel.view` and returns credential and health detail that only an administrator managing a connection needs. Every signed-in employee may call this one, scoped to their own organization.
      summary: List the connected accounts for the inbox
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: number
      - in: query
        name: category
        schema:
          type: number
      - in: query
        name: channel_connection
        schema:
          type: number
      - in: query
        name: channel_connections
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: customer
        schema:
          type: number
      - in: query
        name: follow_up
        schema:
          type: boolean
      - in: query
        name: min_lead_score
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: array
          items:
            type: string
            enum:
            - HIGH
            - LOW
            - NORMAL
            - URGENT
        description: |-
          * `LOW` - Low
          * `NORMAL` - Normal
          * `HIGH` - High
          * `URGENT` - Urgent
        explode: true
        style: form
      - in: query
        name: provider
        schema:
          type: array
          items:
            type: string
            enum:
            - FACEBOOK
            - INSTAGRAM
            - MOCK
            - TIKTOK
            - WHATSAPP
        description: |-
          * `TIKTOK` - TikTok
          * `INSTAGRAM` - Instagram
          * `FACEBOOK` - Facebook Messenger
          * `WHATSAPP` - WhatsApp Business
          * `MOCK` - Mock (development)
        explode: true
        style: form
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: stage
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - CLOSED
            - NEW
            - OPEN
            - RESOLVED
            - WAITING_CUSTOMER
            - WAITING_INTERNAL
        description: |-
          * `NEW` - New
          * `OPEN` - Open
          * `WAITING_CUSTOMER` - Waiting on customer
          * `WAITING_INTERNAL` - Waiting internally
          * `RESOLVED` - Resolved
          * `CLOSED` - Closed
        explode: true
        style: form
      - in: query
        name: team
        schema:
          type: number
      - in: query
        name: unread
        schema:
          type: boolean
      - in: query
        name: view
        schema:
          type: string
