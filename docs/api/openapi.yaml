  /api/conversations/export/:
    get:
      operationId: conversations_export_retrieve
      description: |-
        The inbox as a UTF-8 CSV file (with a byte-order mark, for Excel), streamed — **one row per conversation** and metadata only: no message text, previews or summaries.

        Accepts every filter `/conversations/` accepts (`view`, `status`, `priority`, `channel_connections`, `assigned_to`, `team`, `category`, `customer`, `stage`, `unread`, `follow_up`, `search`, `min_lead_score`, `include_muted`, `ordering`) and returns every matching row the caller may see; `page` and `page_size` are ignored. Muted channels are excluded unless `include_muted` is set, as on the list.

        Requires `crm.export`. Timestamps are ISO 8601 in the organization's timezone with their UTC offset. An empty result is a file with only the header row.
      summary: Export conversations as CSV
      parameters:
      - in: query
        name: channel_connections
        schema:
          type: string
        description: Comma-separated account ids, as on the list.
      - in: query
        name: customer
        schema:
          type: integer
        description: As on the list.
      - in: query
        name: follow_up
        schema:
          type: boolean
        description: As on the list.
      - in: query
        name: include_muted
        schema:
          type: boolean
        description: As on the list.
      - in: query
        name: ordering
        schema:
          type: string
        description: As on the list.
      - in: query
        name: search
        schema:
          type: string
        description: As on the list.
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
        description: As on the list.
      - in: query
        name: view
        schema:
          type: string
        description: As on the list.
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: The CSV file.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A filter does not fit.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Too many exports in the last minute.
