          * `RESOLVED` - Resolved
          * `CLOSED` - Closed
        explode: true
        style: form
      - in: query
        name: team
        schema:
          type: number
      - in: query
        name: unread
        schema:
          type: boolean
      - in: query
        name: view
        schema:
          type: string
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConversationGroupList'
          description: ''
        '401':
          content:
