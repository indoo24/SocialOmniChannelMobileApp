          type: string
          format: date-time
        end:
          type: string
          format: date-time
      required:
      - days
      - end
      - start
    Period:
      type: object
      description: |-
        The window the numbers were computed over, echoed back.

        Both halves are here on purpose. `start_at`/`end_at` are the exact instants
        queried, so a reader can check the arithmetic; `from`/`to` are the local
        calendar dates the caller asked for, so a client can label the range without
        deriving a local calendar from two UTC instants and getting it subtly wrong.
      properties:
        preset:
          type: string
          description: '`today`, `last_7_days`, `last_30_days`, `this_month`, `last_month`,
            or `custom`.'
        start_at:
          type: string
          format: date-time
          description: Inclusive lower bound, UTC.
        end_at:
          type: string
          format: date-time
          description: '**Exclusive** upper bound, UTC — the start of the day after
            `to`. Half-open so adjacent periods cannot both claim the same instant.'
        timezone:
          type: string
          description: The organization timezone the dates resolve in.
        from:
          type: string
          format: date
          description: Local start date.
        to:
          type: string
          format: date
          description: Local end date, inclusive.
      required:
      - end_at
      - from
      - preset
      - start_at
      - timezone
      - to
