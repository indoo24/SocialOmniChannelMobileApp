          description: No such conversation, or no such message inside it.
  /api/conversations/{id}/messages/{message_id}/retry/:
    post:
      operationId: conversations_messages_retry_create
      description: |-
        Re-sends a message whose file is already stored, so a provider outage costs a click rather than the agent's file. Nothing is re-uploaded and no attachment row is duplicated.

        Only a **FAILED** outgoing message can be retried, and the claim is atomic — a message another tab is already retrying, or one that has since succeeded, answers 409 rather than sending twice.
      summary: Send a failed media message again
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this conversation.
        required: true
      - in: path
        name: message_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The provider refused it again.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Not waiting to be retried.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such resource inside the caller's organization. Cross-tenant
            reads are reported as 404 rather than 403, so the response never confirms
            that a row exists.
