  /api/conversations/{id}/attachments/:
    post:
      operationId: conversations_attachments_create
      description: |-
        Uploads one file and returns a **draft** — nothing appears in the customer's timeline until the agent sends it.

        `multipart/form-data` with a `file` part. Everything about the file is decided here rather than by the browser: the type is re-derived from the bytes, the size limit comes from what the conversation's own platform accepts, and the organization comes from the conversation. A draft is private to the agent who staged it and expires if it is never sent.

        Send `is_voice=true` for a browser recording. It is repackaged into the container the platform renders as a voice note, which is done here so a format problem is an upload error rather than a message that silently arrives as a music file.
      summary: Stage a file for sending
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this conversation.
        required: true
      tags:
      - conversations
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                is_voice:
                  type: boolean
                duration_ms:
                  type: integer
              required:
              - file
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentDraft'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Rejected — unsupported type, too large, or no disk.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such resource inside the caller's organization. Cross-tenant
            reads are reported as 404 rather than 403, so the response never confirms
            that a row exists.
