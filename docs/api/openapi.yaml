                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the employee lacks the required capability.
  /api/client-errors/:
    post:
      operationId: report_client_error
      description: |-
        Records a crash caught by a client-side error boundary. Authenticated: an anonymous endpoint that accepts arbitrary text and writes it to the logs is a log-injection tool.

        Answers 204 for any body, including a malformed one — the client is mid-crash and about to reload. Throttled to 20/min per employee.
      summary: Report a browser render error
      tags:
      - client-errors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientErrorReport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientErrorReport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientErrorReport'
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Recorded. No response body.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid session cookie was presented.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Rate limit exceeded (20/min).
