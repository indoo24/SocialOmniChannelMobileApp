components:
  schemas:
    ApiError:
      type: object
      description: '``{"error": {"code": ..., "message": ..., "details": {...}}}``'
      properties:
        error:
          $ref: '#/components/schemas/ApiErrorDetail'
      required:
      - error
    ApiErrorDetail:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable reason, e.g. `validation_error`, `not_found`,
            `throttled`.
        message:
          type: string
          description: Human-readable summary, safe to display.
        details:
          type: object
          additionalProperties: {}
          description: 'Field-level errors as `{field: [message, ...]}` for a validation
            failure; an empty object otherwise.'
      required:
      - code
      - details
      - message
    Assign:
      type: object
      description: '``assignee_id=null`` unassigns; omitting it leaves the assignee
        alone.'
      properties:
        assignee_id:
          type: integer
          nullable: true
        team_id:
          type: integer
          nullable: true
        note:
          type: string
          default: ''
          maxLength: 255
    AttachmentDraft:
      type: object
      description: |-
        A staged file, as the composer sees it.

        Carries no storage key and no path — the same rule as a sent attachment.
        A draft has no content URL either: it is the agent's own upload, already in
        their browser, and offering a download endpoint for unsent files would be a
        second way to reach stored bytes for no benefit.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          readOnly: true
        mime_type:
          type: string
          readOnly: true
        file_name:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
        is_voice:
          type: boolean
          readOnly: true
        duration_ms:
          type: integer
          nullable: true
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - duration_ms
      - expires_at
      - file_name
      - id
      - is_voice
      - mime_type
      - size_bytes
      - type
    AuditMetrics:
      type: object
      properties:
        routing_decisions:
          type: integer
        conversion_events:
          type: integer
      required:
      - conversion_events
      - routing_decisions
    Availability:
      type: object
      properties:
        availability:
          $ref: '#/components/schemas/AvailabilityEnum'
      required:
      - availability
    AvailabilityEnum:
      enum:
      - ONLINE
      - AWAY
      - BREAK
      - OFFLINE
      type: string
      description: |-
        * `ONLINE` - Online
        * `AWAY` - Away
        * `BREAK` - On break
        * `OFFLINE` - Offline
    BlankEnum:
      enum:
      - ''
    CancelOrder:
      type: object
      properties:
        refunded:
          type: boolean
          default: false
        reason:
          type: string
          maxLength: 255
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 60
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          maxLength: 80
        color:
          type: string
          maxLength: 7
        is_system:
          type: boolean
          readOnly: true
        is_active:
          type: boolean
        display_order:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - id
      - is_system
      - label
      - slug
    CategoryUpdate:
      type: object
      properties:
        category_id:
          type: integer
          nullable: true
      required:
      - category_id
    ChannelBreakdownRow:
      type: object
      description: |-
        One row per provider, ordered by volume.

        Muted channels are included: this reports what arrived, not what is queued,
        and hiding a muted channel's volume would make it look like it stopped
        receiving.
      properties:
        provider:
          type: string
        total:
          type: integer
        open:
          type: integer
        unread:
          type: integer
      required:
      - open
      - provider
      - total
      - unread
    ChannelConnection:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        provider_display:
          type: string
          readOnly: true
        external_account_id:
          type: string
          maxLength: 191
        display_name:
          type: string
          maxLength: 160
        avatar_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        status:
          $ref: '#/components/schemas/ChannelConnectionStatusEnum'
        status_detail:
          type: string
          readOnly: true
        is_active:
          type: boolean
        is_operational:
          type: boolean
          readOnly: true
        has_credentials:
          type: boolean
          readOnly: true
        token_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        token_days_remaining:
          type: integer
          nullable: true
          description: |-
            Whole days until the token lapses, or ``None`` if that is unknown.

            Rounded *down*, so "1 day" never means 34 hours. A token already past
            its expiry reports 0 rather than a negative number — at that point the
            countdown is not the story, the ERROR status is.
          readOnly: true
        is_muted:
          type: boolean
          readOnly: true
        muted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        muted_by_name:
          type: string
          readOnly: true
          default: ''
        connection_mode:
          type: string
          description: |-
            The channel's provisioning shape, or empty where there is only one.

            WhatsApp: `cloud_api` or `coexistence`. Instagram: `instagram_login` or
            `facebook_derived`, which is what decides whether sending works today.

            Read straight from configuration rather than stored on the model: it is
            set once at connect time and only WhatsApp has a second mode, so a
            column would be a migration for one string on one provider.
          readOnly: true
        readiness_status:
          type: string
          description: |-
            Whether the provider says this channel can actually work.

            Distinct from `status`, which is OmniChannel's own view, and from
            `is_active`, which is whether we are using it at all. A WhatsApp number
            can be linked perfectly — valid token, subscribed WABA — and still be
            finishing setup on the owner's phone, which is exactly the state a
            customer was shown as "Connected" while nothing arrived.

            `READY` for every provider that has no separate readiness concept, and
            for any WhatsApp channel connected before this was recorded — those are
            demonstrably working and must not be relabelled on a deploy.
          readOnly: true
        setup_completion:
          type: object
          additionalProperties: {}
          description: |-
            What, if anything, the customer must still do — decided server-side.

            The client renders whatever action this names rather than deriving one
            from the provider or the mode. If Meta ever exposes a pairing or
            deep-link mechanism, it becomes a new `action` here and the UI follows
            without a release that reasons about WhatsApp itself.

            `can_check_status` is separate from `required`: a channel that is fine
            has nothing to check, and offering the button anyway invites somebody to
            spend Graph calls proving it.
          readOnly: true
        tiktok_readiness:
          allOf:
          - $ref: '#/components/schemas/TikTokReadiness'
          nullable: true
          readOnly: true
        conversation_count:
          type: integer
          readOnly: true
          default: 0
        connected_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_sync_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_message_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - connected_at
      - connection_mode
      - conversation_count
      - created_at
      - display_name
      - external_account_id
      - has_credentials
      - id
      - is_muted
