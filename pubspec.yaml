name: scenario_mobile
description: "Scenario — omnichannel customer service. Mobile client for the same backend the web app uses."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Localization. English + Arabic, hence flutter_localizations for the
  # framework's own strings (dialog buttons, etc.) and RTL/Directionality
  # support that Arabic needs — `intl` (already a dependency) supplies the
  # ARB tooling `flutter gen-l10n` builds on.
  flutter_localizations:
    sdk: flutter

  # State management. Riverpod over Bloc/Provider because this app is mostly
  # async server state (REST + WebSocket invalidation), which is exactly what
  # AsyncNotifier models directly — and because providers are overridable in
  # tests without a widget tree or a DI container.
  flutter_riverpod: ^3.0.3

  # HTTP. Dio for interceptors (auth refresh, CSRF header, error mapping) and
  # a real cookie jar — the backend authenticates with a session cookie, so a
  # cookie-persisting client is what makes mobile work with zero backend
  # changes.
  dio: ^5.9.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.2.0

  # Secure credential storage. Keychain on iOS, EncryptedSharedPreferences on
  # Android. Session cookies never touch plain SharedPreferences.
  flutter_secure_storage: ^11.0.0

  # Navigation with deep links, needed for tapping a push notification
  # straight into a conversation.
  go_router: ^18.0.1

  # Realtime. The backend speaks plain JSON over a Django Channels socket.
  web_socket_channel: ^3.0.3

  # Presentation helpers.
  intl: ^0.20.2
  cached_network_image: ^4.0.0
  connectivity_plus: ^7.0.0
  path_provider: ^2.1.6

  # Push. Backgrounded/killed-app fallback for the realtime socket above —
  # same two notification types the socket carries, delivered by Firebase
  # Cloud Messaging instead of Django Channels while the app cannot hold a
  # connection open.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

  # Opens a channel-connect OAuth URL (Meta/Instagram/TikTok/WhatsApp
  # Embedded Signup) in the system browser. The redirect completes
  # server-side against `/api/integrations/*/callback/`, so the app never
  # handles a token — it only launches the URL the backend hands back.
  url_launcher: ^6.3.1

  # Composer attachments. image_picker covers both gallery selection and
  # camera capture through one API and requests the platform permission at
  # call-time; record captures a voice note to a local AAC file with a
  # duration stream, matching what the "recording 00:07" UI needs. Both
  # produce a local file this app then uploads itself via the existing
  # attachment-staging endpoint — neither package talks to the backend.
  image_picker: ^1.1.2
  record: ^7.1.1

  # Voice-message playback in the conversation thread — play/pause and
  # progress for a received or sent voice note, streamed straight from the
  # authenticated attachment-content endpoint (a Cookie header, same as
  # every other authenticated request this app makes).
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

  # url_launcher has no platform channel handler in the widget-test
  # environment; tests fake UrlLauncherPlatform.instance instead of letting
  # the real MethodChannel implementation hang waiting for a response.
  url_launcher_platform_interface: ^2.3.2

  # Same reasoning as url_launcher_platform_interface above, for the
  # composer's image_picker/record/path_provider platform channels, and the
  # message thread's audioplayers voice-message playback.
  image_picker_platform_interface: ^2.11.1
  path_provider_platform_interface: ^2.1.2
  record_platform_interface: ^2.1.0
  audioplayers_platform_interface: ^7.2.0
  plugin_platform_interface: ^2.1.8

  # Virtual clock for tests that assert on timer-driven behaviour — the
  # realtime client's reconnect backoff, whose cap would otherwise take ten
  # minutes of wall time to exercise. Already present transitively via
  # flutter_test; declared so the import is explicit.
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

# Regenerate with `dart run flutter_launcher_icons` after changing the
# source image. Legacy icon set only (no adaptive_icon_* keys), matching
# the icon setup already in android/ and ios/ before this was added.
flutter_launcher_icons:
  image_path: "assets/images/app logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
